# Deploys to the GCE VM on GCP. Triggered by pushes to `production`.
#
# Branch split (same convention across ol-node-rest, live-server and admin):
#   production -> GCP  (this file)
#   prodv2     -> AWS  (.github/workflows/production.yml, unchanged)
#   staging    -> AWS  (.github/workflows/staging.yml, unchanged)
#
# The `production` branch was retired on 2026-09-04 when its old SSH-deployed
# EC2 became unreachable, and `production.yml` triggers only on `prodv2`. So
# this pipeline reclaims a free branch name and cannot collide with the live
# AWS deploy.
#
# Reuses .github/deploy/ec2-unpack-ol-node.sh verbatim — that script is
# provider-agnostic (tar + npm ci + prisma generate/migrate + pm2) and is piped
# over stdin exactly the way staging.yml does it over plain ssh.
#
# Required repository (or Environment "production") configuration:
#   vars.GCP_PROJECT_ID    e.g. offoo-prod
#   vars.GCP_ZONE          e.g. asia-south1-a
#   vars.GCE_INSTANCE      defaults to ol-prod-app-01 when unset. Runs the migration
#                          and the workers (the single VM, or the role=core node)
#   vars.GCE_INSTANCE_RUNS_API  'true' (default) | 'false' once GCE_INSTANCE is role=core
#   vars.GCE_API_MIG       optional: regional MIG of role=api nodes (gce-bootstrap.sh).
#                          When set, every instance in it gets the build too, one at a
#                          time, each gated on /health/ready (RUN_MIGRATE=0, no workers).
#                          Unset = single-VM deploy exactly as before.
#   Auth, either:
#     secrets.GCP_WORKLOAD_IDENTITY_PROVIDER + secrets.GCP_DEPLOY_SERVICE_ACCOUNT  (preferred)
#     secrets.GCP_SA_KEY                                                           (service-account JSON fallback)
#
# The deploy service account needs: roles/compute.osAdminLogin (the unpack script
# runs under sudo), roles/iap.tunnelResourceAccessor (the VM has no public IP),
# and roles/compute.viewer.
#
# Secrets are NOT shipped by this pipeline. $APP_DIR/.env on the VM is placed by
# hand from .env.gcp — see docs/flow-md/gcp-deployment-flow.md.
name: GCP production build and deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: gcp-production-gce-ol-node
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The deploy pipes these into `bash -s`, which runs commands as it reads them: a syntax error
      # near the end aborts only after the unpack and migrations ran (2026-10-21). Fail here instead.
      - name: Syntax-check deploy scripts
        run: for f in .github/deploy/*.sh; do bash -n "$f" || { echo "syntax error in $f"; exit 1; }; done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build
        run: npm run build

      # Phase 0 versioning: GET /health reports this commit (src/config/release.ts).
      - name: Stamp release
        run: printf '{"commit":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/release.json

      - name: Pack artifact
        run: |
          tar -czf ol-node-artifact.tgz \
            dist \
            prisma \
            package.json \
            package-lock.json

          ls -lh ol-node-artifact.tgz

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-node-gcp-${{ github.sha }}
          path: ol-node-artifact.tgz
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCE_INSTANCE: ${{ vars.GCE_INSTANCE || 'ol-prod-app-01' }}
      GCE_INSTANCE_RUNS_API: ${{ vars.GCE_INSTANCE_RUNS_API || 'true' }}
      GCE_API_MIG: ${{ vars.GCE_API_MIG }}
      APP_USER: olapp
      APP_DIR: /opt/ol/apps/ol-node-rest
      RUN_MIGRATE: '1'
      RESTART_WORKERS: '1'
      CANARY_SOAK_SECONDS: ${{ vars.CANARY_SOAK_SECONDS || '120' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-node-gcp-${{ github.sha }}

      # Fail with a readable message rather than a confusing gcloud error,
      # mirroring staging.yml's "Check staging EC2 secrets" step.
      # NOTE: the `secrets` context is NOT available in a step-level `if:`
      # (only github/needs/strategy/matrix/job/runner/env/vars/steps/inputs).
      # Referencing it there makes the whole workflow fail to compile, with no
      # job ever starting. So the auth mode is decided here and published as a
      # step output, which `steps.*` CAN read.
      - name: Check GCP deploy configuration
        id: cfg
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          missing=0
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Set repository variable GCP_PROJECT_ID"
            missing=1
          fi
          if [ -z "$GCP_ZONE" ]; then
            echo "::error::Set repository variable GCP_ZONE (e.g. asia-south1-a)"
            missing=1
          fi
          if [ -n "$SA_KEY" ]; then
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ]; then
            echo "auth=wif" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set either secret GCP_SA_KEY, or both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT"
            missing=1
          fi
          if [ "$missing" != "0" ]; then
            exit 1
          fi
          echo "project=$GCP_PROJECT_ID zone=$GCP_ZONE instance=$GCE_INSTANCE"

      - name: Authenticate to GCP (Workload Identity Federation)
        if: steps.cfg.outputs.auth == 'wif'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP (service-account key)
        if: steps.cfg.outputs.auth == 'key'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP identity
        run: |
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          gcloud compute instances describe "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --format="value(name,status)"

      # The VM has no public IP -> IAP tunnel for both scp and ssh.
      - name: Upload artifact to the VM
        run: |
          gcloud compute scp \
            ol-node-artifact.tgz \
            "${GCE_INSTANCE}:/tmp/ol-node-artifact.tgz" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet

      # Runs BEFORE unpacking so a mis-set .env stops the deploy instead of going live.
      # A GCP host with S3_ENDPOINT_URL unset boots fine and silently writes uploads
      # into the AWS S3 bucket; this turns that into a failed deploy.
      - name: Verify storage target (expect Cloudflare R2)
        run: |
          echo '### Object storage target' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo APP_DIR='${APP_DIR}' EXPECT_STORAGE=r2 REQUIRE_PUBLIC_BASE_URL=1 bash -s" \
            < .github/deploy/verify-storage-target.sh 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Unpack and restart on the VM
        run: |
          if [ "$GCE_INSTANCE_RUNS_API" = "false" ]; then restart_api=0; else restart_api=1; fi
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo APP_USER='${APP_USER}' APP_DIR='${APP_DIR}' ARTIFACT=/tmp/ol-node-artifact.tgz RUN_MIGRATE='${RUN_MIGRATE}' RESTART_WORKERS='${RESTART_WORKERS}' RESTART_API='${restart_api}' bash -s" \
            < .github/deploy/ec2-unpack-ol-node.sh

      - name: Health check
        run: |
          if [ "$GCE_INSTANCE_RUNS_API" = "false" ]; then
            # role=core: no ol-api to curl; the worker must be online.
            check="for i in \$(seq 1 12); do if sudo -u ${APP_USER} pm2 describe ol-worker 2>/dev/null | grep -q 'status.*online'; then echo 'worker online'; exit 0; fi; echo \"attempt \$i worker not online\"; sleep 5; done; sudo -u ${APP_USER} pm2 list; exit 1"
          else
            check="for i in \$(seq 1 20); do if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then echo 'ready'; exit 0; fi; echo \"attempt \$i not ready\"; sleep 5; done; echo 'health check failed'; pm2 list; exit 1"
          fi
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "$check"

      # Phase 1 canary: the main VM is the first node with the new build. Soak it (health,
      # process restarts, 5xx count; .github/deploy/canary-soak.sh) BEFORE the release is
      # published or any API node is touched. On failure the next step rolls it back.
      - name: Canary soak (main VM)
        id: canary
        run: |
          if [ "$GCE_INSTANCE_RUNS_API" = "false" ]; then check_api=0; else check_api=1; fi
          gcloud compute ssh "$GCE_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo APP_USER='${APP_USER}' SOAK_SECONDS='${CANARY_SOAK_SECONDS}' CHECK_API='${check_api}' bash -s" \
            < .github/deploy/canary-soak.sh

      # Bucket <current> still names the previous release here (it is only overwritten by the
      # publish step below), so that build goes back on the main VM. Migrations are expand-only,
      # so the previous build runs fine against the new schema.
      - name: Roll the main VM back after a failed canary
        if: failure() && steps.canary.outcome == 'failure' && vars.GCP_RELEASE_BUCKET != ''
        env:
          RELEASE_BUCKET: ${{ vars.GCP_RELEASE_BUCKET }}
        run: |
          prev=$(gcloud storage cat "$RELEASE_BUCKET/ol-node-rest/current" | tr -d '[:space:]')
          if ! printf '%s' "$prev" | grep -Eq '^[0-9a-f]{40}$' || [ "$prev" = "$GITHUB_SHA" ]; then
            echo "::error::no previous release to roll back to (current=${prev:-none}); main VM left on $GITHUB_SHA"
            exit 1
          fi
          gcloud storage cp "$RELEASE_BUCKET/ol-node-rest/$prev.tgz" rollback.tgz --quiet
          gcloud compute scp rollback.tgz "${GCE_INSTANCE}:/tmp/ol-node-rollback.tgz" \
            --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet
          if [ "$GCE_INSTANCE_RUNS_API" = "false" ]; then restart_api=0; else restart_api=1; fi
          gcloud compute ssh "$GCE_INSTANCE" --project "$GCP_PROJECT_ID" --zone "$GCP_ZONE" --tunnel-through-iap --quiet \
            --command "sudo APP_USER='${APP_USER}' APP_DIR='${APP_DIR}' ARTIFACT=/tmp/ol-node-rollback.tgz RUN_MIGRATE=0 RESTART_WORKERS='${RESTART_WORKERS}' RESTART_API='${restart_api}' bash -s" \
            < .github/deploy/ec2-unpack-ol-node.sh
          echo "::error::canary failed on $GCE_INSTANCE; rolled back to $prev; API nodes were not touched"
          exit 1

      # Keeps <bucket>/ol-node-rest/latest.tgz equal to what is actually running, so a
      # VM the MIG (re)creates via .github/deploy/gce-bootstrap.sh boots this build
      # instead of a stale one. Runs after the main VM's health check passed, and BEFORE the
      # API-node rollout, so a node the autoscaler adds mid-rollout boots this build too
      # (2026-10-20: one added during a deploy would otherwise have booted the previous one).
      # Opt-in: skipped until vars.GCP_RELEASE_BUCKET is set (the deploy service account also
      # needs roles/storage.objectUser on that bucket).
      - name: Publish release for the MIG bootstrap
        if: vars.GCP_RELEASE_BUCKET != ''
        env:
          RELEASE_BUCKET: ${{ vars.GCP_RELEASE_BUCKET }}
        run: |
          gcloud storage cp ol-node-artifact.tgz "$RELEASE_BUCKET/ol-node-rest/$GITHUB_SHA.tgz" --quiet
          gcloud storage cp ol-node-artifact.tgz "$RELEASE_BUCKET/ol-node-rest/latest.tgz" --quiet
          # Pinned bootstrap: new VMs boot exactly <current>.tgz (gce-bootstrap.sh), falling back to latest.tgz.
          printf '%s\n' "$GITHUB_SHA" > current
          gcloud storage cp current "$RELEASE_BUCKET/ol-node-rest/current" --quiet
          gcloud storage ls -l "$RELEASE_BUCKET/ol-node-rest/latest.tgz" "$RELEASE_BUCKET/ol-node-rest/current"

      # Migration already ran once on GCE_INSTANCE above, so API nodes only unpack and
      # restart ol-api. One node at a time, each must pass /health/ready before the next,
      # so the LB always has healthy capacity. A failure stops the rollout; nodes not yet
      # reached keep the previous build (migrations are expand-only, so that is safe).
      - name: Roll out to the API MIG
        if: env.GCE_API_MIG != ''
        run: |
          region="${GCP_ZONE%-*}"
          mapfile -t nodes < <(gcloud compute instance-groups managed list-instances "$GCE_API_MIG" \
            --project "$GCP_PROJECT_ID" --region "$region" \
            --format="value(name,instance.segment(-3))")
          if [ "${#nodes[@]}" -eq 0 ]; then
            echo "::error::MIG $GCE_API_MIG in $region has no instances"
            exit 1
          fi
          for line in "${nodes[@]}"; do
            name="${line%%[[:space:]]*}"
            zone="${line##*[[:space:]]}"
            # The autoscaler may remove a node while the rollout runs; skip it instead of hanging.
            status=$(gcloud compute instances describe "$name" --project "$GCP_PROJECT_ID" --zone "$zone" --format="value(status)" 2>/dev/null || true)
            if [ "$status" != "RUNNING" ]; then
              echo "=== $name ($zone) is ${status:-gone}; skipping ==="
              continue
            fi
            echo "=== $name ($zone) ==="
            gcloud compute scp ol-node-artifact.tgz "${name}:/tmp/ol-node-artifact.tgz" \
              --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet
            gcloud compute ssh "$name" --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet \
              --command "sudo APP_DIR='${APP_DIR}' EXPECT_STORAGE=r2 REQUIRE_PUBLIC_BASE_URL=1 bash -s" \
              < .github/deploy/verify-storage-target.sh
            gcloud compute ssh "$name" --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet \
              --command "sudo APP_USER='${APP_USER}' APP_DIR='${APP_DIR}' ARTIFACT=/tmp/ol-node-artifact.tgz RUN_MIGRATE=0 RESTART_WORKERS=0 RESTART_API=1 bash -s" \
              < .github/deploy/ec2-unpack-ol-node.sh
            gcloud compute ssh "$name" --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet \
              --command "for i in \$(seq 1 20); do if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then echo 'ready'; exit 0; fi; echo \"attempt \$i not ready\"; sleep 5; done; echo 'health check failed'; exit 1"
          done

      # Phase 0 rollout re-check: every API node (including one the autoscaler added during the
      # rollout) must report this commit on /health. A node on another commit is redeployed once;
      # still wrong after that fails the run.
      - name: Re-check every node runs this commit
        if: env.GCE_API_MIG != ''
        run: |
          region="${GCP_ZONE%-*}"
          commit_of() {
            gcloud compute ssh "$1" --project "$GCP_PROJECT_ID" --zone "$2" --tunnel-through-iap --quiet \
              --command "curl -fsS http://127.0.0.1:3000/health 2>/dev/null | grep -o '\"commit\":\"[0-9a-f]*\"' | cut -d'\"' -f4" 2>/dev/null | tr -d '\r' | tail -1
          }
          bad=0
          main=$(commit_of "$GCE_INSTANCE" "$GCP_ZONE")
          echo "$GCE_INSTANCE $GCP_ZONE ${main:-none}"
          if [ "$GCE_INSTANCE_RUNS_API" != "false" ] && [ "$main" != "$GITHUB_SHA" ]; then bad=1; fi
          mapfile -t nodes < <(gcloud compute instance-groups managed list-instances "$GCE_API_MIG" \
            --project "$GCP_PROJECT_ID" --region "$region" --format="value(name,instance.segment(-3))")
          for line in "${nodes[@]}"; do
            name="${line%%[[:space:]]*}"; zone="${line##*[[:space:]]}"
            got=$(commit_of "$name" "$zone")
            echo "$name $zone ${got:-none}"
            [ "$got" = "$GITHUB_SHA" ] && continue
            echo "=== $name runs ${got:-unknown}; redeploying ==="
            gcloud compute scp ol-node-artifact.tgz "${name}:/tmp/ol-node-artifact.tgz" \
              --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet || { bad=1; continue; }
            gcloud compute ssh "$name" --project "$GCP_PROJECT_ID" --zone "$zone" --tunnel-through-iap --quiet \
              --command "sudo APP_USER='${APP_USER}' APP_DIR='${APP_DIR}' ARTIFACT=/tmp/ol-node-artifact.tgz RUN_MIGRATE=0 RESTART_WORKERS=0 RESTART_API=1 bash -s" \
              < .github/deploy/ec2-unpack-ol-node.sh || { bad=1; continue; }
            sleep 15
            got=$(commit_of "$name" "$zone")
            echo "$name after redeploy: ${got:-none}"
            [ "$got" = "$GITHUB_SHA" ] || bad=1
          done
          [ "$bad" = 0 ] || { echo "::error::a node does not run $GITHUB_SHA"; exit 1; }
