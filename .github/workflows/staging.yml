name: Staging build and deploy

# Same as production.yml (OIDC → S3 → SSM). Staging instance + app paths only.
# SSH from GitHub to :22 times out (security group / public SSH). SSM does not use port 22.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-ec2-ol-node
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::465457334877:role/ol-prod-github-deploy-role
  DEPLOY_BUCKET: ol-production-deploy-artifacts-465457334877
  EC2_INSTANCE_ID: i-04b31dbda6ed0edc4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build
        run: npm run build

      - name: Pack artifact
        run: |
          tar -czf ol-node-artifact.tgz \
            dist \
            prisma \
            package.json \
            package-lock.json
          ls -lh ol-node-artifact.tgz

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ol-node-${{ github.sha }}
          path: ol-node-artifact.tgz
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ol-node-${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment artifact to S3
        run: |
          aws s3 cp ol-node-artifact.tgz \
            "s3://${DEPLOY_BUCKET}/ol-node/staging-ol-node-${GITHUB_SHA}.tgz"

      - name: Upload deployment script to S3
        run: |
          aws s3 cp .github/deploy/ec2-unpack-ol-node.sh \
            "s3://${DEPLOY_BUCKET}/ol-node/staging-ec2-unpack-ol-node-${GITHUB_SHA}.sh"

      - name: Send deployment command to EC2
        env:
          ARTIFACT_KEY: ol-node/staging-ol-node-${{ github.sha }}.tgz
          DEPLOY_SCRIPT_KEY: ol-node/staging-ec2-unpack-ol-node-${{ github.sha }}.sh
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 1800 \
              --comment "OL Node staging deployment ${GITHUB_SHA}" \
              --parameters commands="[
                \"set -e\",
                \"export PATH=/usr/bin:/usr/local/bin:\$PATH\",
                \"rm -f /tmp/ol-node-artifact.tgz /tmp/ec2-unpack-ol-node.sh\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY} /tmp/ol-node-artifact.tgz\",
                \"aws s3 cp s3://${DEPLOY_BUCKET}/${DEPLOY_SCRIPT_KEY} /tmp/ec2-unpack-ol-node.sh\",
                \"chmod 700 /tmp/ec2-unpack-ol-node.sh\",
                \"APP_USER=ec2-user APP_DIR=/home/ec2-user/ol-node LOG_DIR=/home/ec2-user/ol-node/logs ARTIFACT=/tmp/ol-node-artifact.tgz RUN_MIGRATE=1 RESTART_WORKERS=1 bash /tmp/ec2-unpack-ol-node.sh\"
              ]" \
              --query 'Command.CommandId' \
              --output text
          )
          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          echo "Waiting for SSM deployment..."
          for i in {1..120}; do
            STATUS=$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text
            )
            echo "Attempt $i: SSM status = $STATUS"
            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output yaml
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                sleep 5
                ;;
            esac
            if [ "$i" -eq 120 ]; then
              echo "Deployment timed out waiting for SSM."
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                --output yaml
              exit 1
            fi
          done

      - name: Show deployment output
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output yaml
