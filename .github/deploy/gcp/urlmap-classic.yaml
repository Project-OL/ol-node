# Live since 2026-10-27 (INF-25): classic external ALB url map. Apply: gcloud compute url-maps import
# cl-ol-node-rest-urlmap --source=<this file with __PROJECT__ replaced> --global. The managed LB
# (urlmap-main.yaml) was deleted 2026-11-03 (INF-28).
name: cl-ol-node-rest-urlmap
description: "INF-25: classic external ALB copy of ol-node-rest-urlmap (same host/path rules)"
defaultService: https://www.googleapis.com/compute/v1/projects/__PROJECT__/global/backendServices/cl-api-backend
hostRules:
- hosts:
  - '*'
  pathMatcher: live-matcher
- hosts:
  - admins3jinyu.offoolive.com
  - priviledge.offoolive.com
  pathMatcher: admin-matcher
pathMatchers:
- name: live-matcher
  defaultService: https://www.googleapis.com/compute/v1/projects/__PROJECT__/global/backendServices/cl-api-backend
  pathRules:
  - paths:
    - /api/live-stream
    - /api/live-stream/*
    - /api/video-call
    - /api/video-call/*
    - /hls/*
    - /live-health
    - /socket.io
    - /socket.io/*
    - /api/v1/admin/live/*
    service: https://www.googleapis.com/compute/v1/projects/__PROJECT__/global/backendServices/cl-live-backend
  - paths:
    - /ws
    service: https://www.googleapis.com/compute/v1/projects/__PROJECT__/global/backendServices/cl-ws-backend
- name: admin-matcher
  defaultService: https://www.googleapis.com/compute/v1/projects/__PROJECT__/global/backendServices/cl-admin-backend
